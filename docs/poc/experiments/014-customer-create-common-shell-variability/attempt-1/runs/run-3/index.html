<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>顧客追加 | 業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shared-shell" data-theme="light" data-drawer="open">
      <header class="header">
        <button class="icon-button" type="button" data-drawer-toggle aria-controls="workspace-drawer" aria-expanded="true" aria-label="Drawer を閉じる"><span aria-hidden="true">☰</span></button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button theme-button" type="button" data-theme-toggle aria-label="ダークモードに切り替える"><span data-theme-icon aria-hidden="true">◐</span></button>
      </header>

      <div class="shell-content">
        <aside class="drawer" id="workspace-drawer" aria-label="業務ワークスペースのナビゲーション">
          <nav>
            <ul class="drawer-list">
              <li><a href="#section-a">セクション A</a></li>
              <li class="drawer-parent">
                <a href="#section-b">セクション B</a><span class="disclosure" aria-label="展開中">⌄</span>
                <ul class="drawer-children">
                  <li><a class="current" href="#customer-create" aria-current="page">項目 B-1</a></li>
                  <li><a href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>

        <main class="workspace" id="customer-create">
          <div class="page-header">
            <h1>顧客追加</h1>
            <p>新しい顧客情報を登録します。</p>
          </div>

          <section class="form-surface" aria-labelledby="customer-information-heading">
            <div class="section-heading">
              <h2 id="customer-information-heading">顧客情報</h2>
              <p><span aria-hidden="true">*</span> は必須項目です。</p>
            </div>

            <div class="error-summary" id="error-summary" tabindex="-1" hidden>
              <h2>入力内容を確認してください</h2>
              <ul id="error-summary-list"></ul>
            </div>

            <form id="customer-form" novalidate>
              <div class="field">
                <label for="full-name">氏名 <span class="required">必須</span></label>
                <input id="full-name" name="fullName" type="text" autocomplete="name" required aria-describedby="full-name-error">
                <p class="field-error" id="full-name-error"></p>
              </div>
              <div class="field">
                <label for="birth-date">生年月日 <span class="required">必須</span></label>
                <input id="birth-date" name="birthDate" type="text" inputmode="numeric" autocomplete="bday" placeholder="例: 1990-01-31" required aria-describedby="birth-date-help birth-date-error">
                <p class="field-help" id="birth-date-help">YYYY-MM-DD 形式で入力してください。</p>
                <p class="field-error" id="birth-date-error"></p>
              </div>
              <div class="field">
                <label for="address">住所 <span class="required">必須</span></label>
                <input id="address" name="address" type="text" autocomplete="street-address" required aria-describedby="address-error">
                <p class="field-error" id="address-error"></p>
              </div>
              <div class="field">
                <label for="phone">電話番号 <span class="required">必須</span></label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="例: 03-1234-5678" required aria-describedby="phone-help phone-error">
                <p class="field-help" id="phone-help">数字、ハイフン、半角スペースを使用できます。</p>
                <p class="field-error" id="phone-error"></p>
              </div>
              <div class="field">
                <label for="email">メールアドレス <span class="required">必須</span></label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="例: name@example.com" required aria-describedby="email-error">
                <p class="field-error" id="email-error"></p>
              </div>
              <div class="field">
                <label for="notes">備考 <span class="optional">任意</span></label>
                <textarea id="notes" name="notes" rows="4"></textarea>
              </div>

              <div class="form-actions">
                <p class="action-note" id="save-note">この画面では入力内容の検証のみを行います。保存は実行されません。</p>
                <button class="primary-button" type="submit" aria-describedby="save-note">保存</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
