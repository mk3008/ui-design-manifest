<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顧客検索 | Customer Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="ナビゲーションを閉じる" aria-expanded="true">☰</button>
      <a class="brand" href="#search" data-view="search">Customer Desk</a>
      <div class="header-context">営業支援</div>
      <div class="header-user">CS <span>サポート担当</span></div>
    </header>
    <aside class="drawer" id="drawer" aria-label="メインナビゲーション">
      <div class="drawer-heading">業務メニュー</div>
      <nav>
        <button class="nav-item is-current" type="button" data-view="search"><span class="nav-mark">⌕</span>顧客検索</button>
        <button class="nav-item" type="button" data-view="create"><span class="nav-mark">＋</span>顧客登録</button>
      </nav>
      <div class="drawer-foot">Customer operations<br><small>デモ環境</small></div>
    </aside>
    <main class="workspace" id="workspace">
      <div id="status" class="status" role="status" hidden></div>
      <section id="search-view" class="view is-active" aria-labelledby="search-title">
        <nav class="breadcrumb" aria-label="パンくず"><ol><li><a href="#search" data-view="search">ホーム</a></li><li aria-current="page">顧客検索</li></ol></nav>
        <div class="page-heading"><div><p class="eyebrow">CUSTOMERS</p><h1 id="search-title">顧客検索</h1><p>登録済みの顧客情報を検索・確認します。</p></div><button class="button primary" type="button" data-view="create">新規顧客を登録</button></div>
        <section class="search-panel" aria-labelledby="condition-title">
          <div class="section-heading"><h2 id="condition-title">検索条件</h2><p>条件を入力して検索してください。</p></div>
          <form id="search-form">
            <div class="condition-grid">
              <label>氏名<input name="name" autocomplete="off"></label>
              <label>生年月日<input name="birthday" type="date"></label>
              <label>電話番号<input name="phone" autocomplete="off"></label>
              <label>メールアドレス<input name="email" type="email" autocomplete="off"></label>
            </div>
            <div class="form-actions"><button class="button primary" type="submit">検索</button><button class="button secondary" type="button" id="clear-search">クリア</button></div>
          </form>
        </section>
        <section class="results" aria-labelledby="results-title">
          <div class="results-header"><div><h2 id="results-title">検索結果</h2><p id="result-count">6件</p></div><span class="result-note">氏名を選択すると詳細を確認できます</span></div>
          <div class="table-frame"><table><thead><tr><th scope="col">顧客ID</th><th scope="col">氏名</th><th scope="col">生年月日</th><th scope="col">電話番号</th><th scope="col">メールアドレス</th><th scope="col" class="action-col"><span class="sr-only">操作</span></th></tr></thead><tbody id="results-body"></tbody></table></div>
        </section>
      </section>
      <section id="detail-view" class="view" aria-labelledby="detail-title"></section>
      <section id="create-view" class="view" aria-labelledby="create-title"></section>
      <section id="edit-view" class="view" aria-labelledby="edit-title"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="delete-modal" hidden><section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-title"><p class="dialog-kicker">削除の確認</p><h2 id="delete-title">顧客を削除しますか？</h2><p id="delete-message"></p><div class="dialog-actions"><button class="button danger" id="confirm-delete" type="button">削除</button><button class="button secondary" id="cancel-delete" type="button">キャンセル</button></div></section></div>
  <script src="app.js"></script>
</body>
</html>
