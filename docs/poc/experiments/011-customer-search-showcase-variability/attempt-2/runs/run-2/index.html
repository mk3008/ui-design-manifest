<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>顧客検索</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="product" href="#search">顧客管理</a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="ダークテーマに切り替える">テーマ: ライト</button>
    </header>
    <main id="search" class="workspace">
      <header class="page-header">
        <h1>顧客検索</h1>
        <p>氏名、生年月日、電話番号、メールアドレスで顧客を検索できます。</p>
      </header>

      <section class="search-panel" aria-labelledby="conditions-title">
        <h2 id="conditions-title">検索条件</h2>
        <form id="search-form" novalidate>
          <div class="conditions">
            <label>氏名<input name="name" type="search" autocomplete="name" placeholder="例: 佐藤 花子"></label>
            <label>生年月日<input name="birthDate" type="date"></label>
            <label>電話番号<input name="phone" type="tel" autocomplete="tel" placeholder="例: 03-1234-5678"></label>
            <label>メールアドレス<input name="email" type="email" autocomplete="email" placeholder="例: hanako@example.jp"></label>
          </div>
          <div class="form-actions">
            <button class="primary" type="submit">検索</button>
            <button class="secondary" type="button" id="clear">クリア</button>
          </div>
        </form>
      </section>

      <section class="results" aria-labelledby="results-title" aria-describedby="result-context">
        <div class="result-summary">
          <h2 id="results-title">検索結果 <span id="result-count" class="count"></span></h2>
          <p id="result-context">顧客IDを除く登録情報を確認できます。</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col">顧客ID</th><th scope="col">氏名</th><th scope="col">生年月日</th><th scope="col">住所</th><th scope="col">電話番号</th><th scope="col">メールアドレス</th></tr></thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
        <p class="empty" id="empty-state" hidden>条件に一致する顧客はありません。条件を変更して再度検索してください。</p>
      </section>
    </main>

    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <div class="dialog-header"><h2 id="detail-title">顧客詳細</h2><button class="icon-button" type="button" id="close-dialog" aria-label="顧客詳細を閉じる">×</button></div>
      <dl id="customer-details"></dl>
      <div class="dialog-actions"><button class="primary" type="button" id="done">閉じる</button></div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
