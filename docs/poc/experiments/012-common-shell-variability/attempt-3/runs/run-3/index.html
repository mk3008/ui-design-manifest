<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light" data-drawer="open">
      <header class="app-header">
        <button class="icon-button" type="button" data-drawer-toggle aria-controls="navigation-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="ダークテーマに切り替える">
          <span data-theme-icon aria-hidden="true">☾</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="navigation-drawer" aria-label="ワークスペースナビゲーション">
          <nav>
            <ul class="drawer-list">
              <li><button class="nav-item" type="button">セクション A</button></li>
              <li>
                <button class="nav-item parent-item" type="button" aria-expanded="true">
                  <span>セクション B</span><span class="disclosure" aria-hidden="true">⌄</span>
                </button>
                <ul class="nested-list">
                  <li><button class="nav-item nested-item is-current" type="button" aria-current="page">項目 B-1</button></li>
                  <li><button class="nav-item nested-item" type="button">項目 B-2</button></li>
                </ul>
              </li>
              <li><button class="nav-item" type="button">セクション C</button></li>
            </ul>
          </nav>
        </aside>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
