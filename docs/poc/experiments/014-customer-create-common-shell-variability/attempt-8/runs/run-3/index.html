<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="page.css">
  </head>
  <body>
    <div class="shared-shell" data-theme="light" data-drawer="open">
      <header class="shell-header">
        <button class="shell-icon-button" type="button" data-drawer-toggle aria-controls="workspace-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="shell-workspace-name">業務ワークスペース</p>
        <button class="shell-icon-button shell-theme-button" type="button" data-theme-toggle aria-label="ダークモードに切り替える">
          <span data-theme-icon aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="shell-drawer" id="workspace-drawer" aria-label="業務ワークスペースのナビゲーション">
          <nav>
            <ul class="shell-drawer-list">
              <li><a href="#section-a">セクション A</a></li>
              <li class="shell-drawer-parent">
                <a href="#section-b">セクション B</a>
                <span class="shell-disclosure" aria-label="展開中">⌄</span>
                <ul class="shell-drawer-children">
                  <li><a class="current" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                  <li><a href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>
        <main class="shell-workspace" aria-label="ワークスペース">
          <section class="create-screen" aria-labelledby="page-title">
            <header class="create-page-heading">
              <h1 id="page-title">顧客追加</h1>
              <p>新しい顧客情報を登録します。</p>
            </header>

            <form class="create-form" novalidate aria-describedby="form-status" data-customer-create-form>
              <div class="create-form-intro">
                <h2>顧客情報</h2>
              </div>

              <div class="form-error-summary" data-error-summary hidden tabindex="-1" aria-labelledby="error-summary-title">
                <h2 id="error-summary-title">入力内容を確認してください</h2>
                <ul data-error-summary-list></ul>
              </div>

              <div class="create-field-flow">
                <div class="create-field">
                  <label for="customer-name">氏名 <span class="create-required">必須</span></label>
                  <input id="customer-name" name="customer-name" type="text" autocomplete="name" required aria-describedby="customer-name-error">
                  <p class="field-error" id="customer-name-error" data-error-for="customer-name" aria-live="polite"></p>
                </div>

                <div class="create-field">
                  <label for="birth-date">生年月日 <span class="create-required">必須</span></label>
                  <input id="birth-date" name="birth-date" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" required aria-describedby="birth-date-help birth-date-error">
                  <p class="field-help" id="birth-date-help">生年月日は YYYY-MM-DD 形式で入力してください。</p>
                  <p class="field-error" id="birth-date-error" data-error-for="birth-date" aria-live="polite"></p>
                </div>

                <div class="create-field">
                  <label for="address">住所 <span class="create-required">必須</span></label>
                  <input id="address" name="address" type="text" autocomplete="street-address" required aria-describedby="address-error">
                  <p class="field-error" id="address-error" data-error-for="address" aria-live="polite"></p>
                </div>

                <div class="create-field">
                  <label for="telephone">電話番号 <span class="create-required">必須</span></label>
                  <input id="telephone" name="telephone" type="tel" inputmode="tel" autocomplete="tel" placeholder="03-1234-5678" required aria-describedby="telephone-help telephone-error">
                  <p class="field-help" id="telephone-help">電話番号は数字とハイフンを使用して入力してください。</p>
                  <p class="field-error" id="telephone-error" data-error-for="telephone" aria-live="polite"></p>
                </div>

                <div class="create-field">
                  <label for="email">メールアドレス <span class="create-required">必須</span></label>
                  <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.jp" required aria-describedby="email-help email-error">
                  <p class="field-help" id="email-help">メールアドレスは name@example.jp 形式で入力してください。</p>
                  <p class="field-error" id="email-error" data-error-for="email" aria-live="polite"></p>
                </div>

                <div class="create-field">
                  <label for="notes">備考 <span class="create-optional">任意</span></label>
                  <textarea id="notes" name="notes" rows="4" aria-describedby="notes-error"></textarea>
                  <p class="field-error" id="notes-error" data-error-for="notes" aria-live="polite"></p>
                </div>
              </div>

              <div class="form-action-toolbar">
                <div class="form-action-group">
                  <button class="button-primary" type="submit">保存</button>
                  <button class="button-secondary" type="button">キャンセル</button>
                </div>
              </div>
              <p class="form-status" id="form-status" aria-live="polite"></p>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script src="page.js"></script>
  </body>
</html>
