<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える">
          <span id="theme-icon" aria-hidden="true">☼</span>
        </button>
      </header>

      <div class="shell-body" id="shell-body">
        <aside class="drawer" id="drawer" aria-label="メインナビゲーション">
          <nav>
            <ul class="navigation-list">
              <li><a class="navigation-item" href="#section-a">セクション A</a></li>
              <li>
                <a class="navigation-item parent-item" href="#section-b">
                  <span>セクション B</span><span class="disclosure-icon" aria-hidden="true">⌄</span>
                </a>
                <ul class="child-list">
                  <li><a class="navigation-item child-item current-item" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                  <li><a class="navigation-item child-item" href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a class="navigation-item" href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
