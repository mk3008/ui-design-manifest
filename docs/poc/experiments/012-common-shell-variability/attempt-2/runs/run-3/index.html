<!doctype html>
<html lang="ja" data-theme="light" data-drawer="open">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-controls="app-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
        <span aria-hidden="true">☰</span>
      </button>
      <p class="workspace-name">業務ワークスペース</p>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える">
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </header>

    <div class="shell">
      <aside class="drawer" id="app-drawer" aria-label="主要ナビゲーション">
        <nav aria-label="セクション">
          <ul class="navigation-list">
            <li><button class="navigation-item" type="button">セクション A</button></li>
            <li>
              <div class="navigation-parent">
                <button class="navigation-item" type="button">セクション B</button>
                <span class="disclosure-icon" aria-label="展開中">⌄</span>
              </div>
              <ul class="navigation-children">
                <li><button class="navigation-item navigation-current" type="button" aria-current="page">項目 B-1</button></li>
                <li><button class="navigation-item" type="button">項目 B-2</button></li>
              </ul>
            </li>
            <li><button class="navigation-item" type="button">セクション C</button></li>
          </ul>
        </nav>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
