<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="page.css">
  </head>
  <body>
    <div class="shared-shell" data-theme="light" data-drawer="open">
      <header class="shell-header">
        <button class="shell-icon-button" type="button" data-drawer-toggle aria-controls="workspace-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="shell-workspace-name">業務ワークスペース</p>
        <button class="shell-icon-button shell-theme-button" type="button" data-theme-toggle aria-label="ダークモードに切り替える">
          <span data-theme-icon aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="shell-drawer" id="workspace-drawer" aria-label="業務ワークスペースのナビゲーション">
          <nav>
            <ul class="shell-drawer-list">
              <li><a href="#section-a">セクション A</a></li>
              <li class="shell-drawer-parent">
                <a href="#section-b">セクション B</a>
                <span class="shell-disclosure" aria-label="展開中">⌄</span>
                <ul class="shell-drawer-children">
                  <li><a class="current" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                  <li><a href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>
        <main class="shell-workspace" aria-label="ワークスペース">
          <section class="create-page" aria-labelledby="page-title">
            <header class="page-header">
              <h1 id="page-title">顧客追加</h1>
              <p>新しい顧客情報を登録します。</p>
            </header>

            <form class="customer-form" novalidate aria-describedby="form-summary">
              <div class="form-intro">
                <h2>顧客情報</h2>
              </div>
              <div class="form-summary" id="form-summary" role="alert" tabindex="-1" hidden></div>

              <div class="field-flow">
                <div class="form-field" data-field="name">
                  <label for="customer-name">氏名 <span class="required" aria-hidden="true">必須</span><span class="sr-only">（必須）</span></label>
                  <input id="customer-name" name="name" type="text" autocomplete="name" aria-required="true" aria-describedby="name-help name-error">
                  <p class="field-help" id="name-help">氏名を入力してください。</p>
                  <p class="field-error" id="name-error" aria-live="polite" hidden></p>
                </div>

                <div class="form-field" data-field="birthDate">
                  <label for="birth-date">生年月日 <span class="required" aria-hidden="true">必須</span><span class="sr-only">（必須）</span></label>
                  <input id="birth-date" name="birthDate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" aria-required="true" aria-describedby="birth-date-help birth-date-error">
                  <p class="field-help" id="birth-date-help">生年月日は YYYY-MM-DD 形式で入力してください。</p>
                  <p class="field-error" id="birth-date-error" aria-live="polite" hidden></p>
                </div>

                <div class="form-field" data-field="address">
                  <label for="address">住所 <span class="required" aria-hidden="true">必須</span><span class="sr-only">（必須）</span></label>
                  <input id="address" name="address" type="text" autocomplete="street-address" aria-required="true" aria-describedby="address-help address-error">
                  <p class="field-help" id="address-help">住所を入力してください。</p>
                  <p class="field-error" id="address-error" aria-live="polite" hidden></p>
                </div>

                <div class="form-field" data-field="phone">
                  <label for="phone">電話番号 <span class="required" aria-hidden="true">必須</span><span class="sr-only">（必須）</span></label>
                  <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="03-1234-5678" autocomplete="tel" aria-required="true" aria-describedby="phone-help phone-error">
                  <p class="field-help" id="phone-help">電話番号は 03-1234-5678 形式で入力してください。</p>
                  <p class="field-error" id="phone-error" aria-live="polite" hidden></p>
                </div>

                <div class="form-field" data-field="email">
                  <label for="email">メールアドレス <span class="required" aria-hidden="true">必須</span><span class="sr-only">（必須）</span></label>
                  <input id="email" name="email" type="email" inputmode="email" placeholder="name@example.com" autocomplete="email" aria-required="true" aria-describedby="email-help email-error">
                  <p class="field-help" id="email-help">メールアドレスは name@example.com 形式で入力してください。</p>
                  <p class="field-error" id="email-error" aria-live="polite" hidden></p>
                </div>

                <div class="form-field" data-field="notes">
                  <label for="notes">備考 <span class="optional">任意</span></label>
                  <textarea id="notes" name="notes" rows="4" aria-describedby="notes-help"></textarea>
                  <p class="field-help" id="notes-help">備考を入力してください。</p>
                </div>
              </div>

              <div class="form-action-toolbar" aria-label="顧客追加の操作">
                <div class="form-actions">
                  <button class="button button-primary" type="submit">保存</button>
                  <button class="button button-secondary" type="button" data-cancel>キャンセル</button>
                </div>
              </div>
              <p class="submission-note" aria-live="polite" data-submission-note></p>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script src="page.js"></script>
  </body>
</html>
