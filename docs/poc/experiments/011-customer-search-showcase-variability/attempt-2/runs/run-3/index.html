<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>顧客検索</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">検索内容へ移動</a>
    <header class="app-header">
      <div class="brand" aria-label="顧客管理">顧客管理</div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="ダークモードに切り替え">☾ <span>テーマ</span></button>
    </header>
    <main id="main" class="workspace">
      <header class="page-header">
        <div>
          <h1>顧客検索</h1>
          <p>登録済みの顧客情報を検索・確認できます。</p>
        </div>
      </header>

      <section class="search-panel" aria-labelledby="conditions-title">
        <div class="section-heading"><h2 id="conditions-title">検索条件</h2></div>
        <form id="search-form" novalidate>
          <div class="condition-grid">
            <label>氏名<input id="name" name="name" type="search" autocomplete="name" placeholder="例：山田 太郎" /></label>
            <label>生年月日<input id="birthdate" name="birthdate" type="date" /></label>
            <label>電話番号<input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="例：03-1234-5678" /></label>
            <label>メールアドレス<input id="email" name="email" type="email" autocomplete="email" placeholder="例：taro@example.jp" /></label>
          </div>
          <div class="search-actions"><button class="primary" type="submit">検索</button><button id="clear" class="secondary" type="button">クリア</button></div>
        </form>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="results-summary">
          <div><h2 id="results-title">検索結果 <span id="count" class="count"></span></h2><p id="result-context">すべての顧客を表示しています。</p></div>
        </div>
        <div class="table-wrap" tabindex="0">
          <table>
            <thead><tr><th scope="col">顧客ID</th><th scope="col" aria-sort="none"><button class="sort-button" data-sort="name" type="button">氏名 <span aria-hidden="true">↕</span></button></th><th scope="col">生年月日</th><th scope="col">住所</th><th scope="col">電話番号</th><th scope="col">メールアドレス</th><th scope="col">備考</th></tr></thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="検索結果のページ移動"><span id="page-status"></span><div><button id="previous" class="secondary" type="button">前へ</button><button id="next" class="secondary" type="button">次へ</button></div></nav>
      </section>
    </main>
    <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title">顧客情報</h2><button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">×</button></div><dl id="detail-content" class="detail-list"></dl></dialog>
    <div id="live-region" class="sr-only" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
