<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-drawer="open" data-theme="light">
      <header class="header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-controls="primary-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <h1>業務ワークスペース</h1>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える">
          <svg class="theme-icon theme-icon-light" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
          <svg class="theme-icon theme-icon-dark" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" /></svg>
        </button>
      </header>

      <aside class="drawer" id="primary-drawer" aria-label="主要ナビゲーション">
        <nav>
          <ul class="drawer-list">
            <li><a href="#section-a">セクション A</a></li>
            <li class="parent-item">
              <span>セクション B</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
              <ul class="nested-list">
                <li><a class="current" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                <li><a href="#item-b-2">項目 B-2</a></li>
              </ul>
            </li>
            <li><a href="#section-c">セクション C</a></li>
          </ul>
        </nav>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
